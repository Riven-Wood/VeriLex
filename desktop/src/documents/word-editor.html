<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' blob:; style-src 'self' blob:; img-src data: blob:; font-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>合同 Word 编辑器</title><link rel="stylesheet" href="./word-editor.css">
<script src="./docxodus.bundle.js" defer></script><script src="./word-selection.js" defer></script><script src="./word-context.js" defer></script><script src="./word-clipboard.js" defer></script><script src="./word-keyboard.js" defer></script><script src="./word-search.js" defer></script><script src="./word-layout.js" defer></script><script src="./word-guides.js" defer></script><script src="./word-editor.js" defer></script>
</head><body>
<div id="tools" role="toolbar" aria-label="Word 编辑工具">
<div id="format-tools" role="group" aria-label="文字与表格格式">
<button id="history-undo" class="tool-icon" data-command="undo" aria-label="撤销" title="撤销（⌘/Ctrl+Z）" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 10l6 6M3 10h11a7 7 0 0 1 0 14" transform="translate(0,-2)"/></svg></button>
<button id="history-redo" class="tool-icon" data-command="redo" aria-label="重做" title="重做（⇧⌘Z / Ctrl+Y）" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 4 6 6-6 6m6-6H10a7 7 0 0 0 0 14" transform="translate(0,-2)"/></svg></button>
<button id="search-open" aria-label="查找与替换" title="查找与替换（⌘/Ctrl+F）" aria-expanded="false" aria-controls="search-panel">查找</button>
<select id="font" aria-label="字体"><option value="">字体</option><option>宋体</option><option>黑体</option><option>楷体</option><option>仿宋</option><option>Arial</option><option>Times New Roman</option></select>
<select id="size" aria-label="字号"><option value="">字号</option><option value="42">初号（42 磅）</option><option value="36">小初（36 磅）</option><option value="26">一号（26 磅）</option><option value="24">小一（24 磅）</option><option value="22">二号（22 磅）</option><option value="18">小二（18 磅）</option><option value="16">三号（16 磅）</option><option value="15">小三（15 磅）</option><option value="14">四号（14 磅）</option><option value="12">小四（12 磅）</option><option value="10.5">五号（10.5 磅）</option><option value="9">小五（9 磅）</option><option value="7.5">六号（7.5 磅）</option><option value="6.5">小六（6.5 磅）</option><option value="5.5">七号（5.5 磅）</option><option value="5">八号（5 磅）</option></select>
<button class="tool-icon" data-command="bold" aria-label="加粗" title="加粗"><b aria-hidden="true">B</b></button><button class="tool-icon" data-command="italic" aria-label="斜体" title="斜体"><i aria-hidden="true">I</i></button><button class="tool-icon" data-command="underline" aria-label="下划线" title="下划线"><u aria-hidden="true">U</u></button>
<span class="divider"></span><button class="tool-icon" data-command="left" aria-label="左对齐" title="左对齐"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 10h10M4 15h16M4 20h10"/></svg></button><button class="tool-icon" data-command="center" aria-label="居中" title="居中"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M7 10h10M4 15h16M7 20h10"/></svg></button><button class="tool-icon" data-command="right" aria-label="右对齐" title="右对齐"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M10 10h10M4 15h16M10 20h10"/></svg></button>
<button class="tool-icon" data-command="bullet" aria-label="项目符号" title="项目符号"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button><button class="tool-icon" data-command="decimal" aria-label="编号" title="编号"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10M3 3h1v5M3 8h3M3 12c4-2 4 1 1 3l-1 2h3"/></svg></button><button class="tool-icon" id="paragraph-open" aria-label="段落设置" title="段落设置" aria-expanded="false" aria-controls="paragraph-panel"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4v16M18 4v16M20 4H9a4 4 0 0 0 0 8h4"/></svg></button><button class="tool-icon" id="table-open" aria-label="插入与编辑表格" title="插入与编辑表格" aria-expanded="false" aria-controls="table-panel"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 9v12M15 9v12"/></svg></button>
</div><div id="review-tools" role="group" aria-label="修订与批注工具"><button id="tracking" aria-pressed="true">修订：开</button><button class="tool-icon" id="new-comment" aria-label="新建批注" title="新建批注"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11v6a2 2 0 0 1-2 2H7l-4 3V5a2 2 0 0 1 2-2h8M18 2v6M15 5h6M7 9h5M7 13h8"/></svg></button><button id="show-review" aria-expanded="false">修订与批注</button></div>
</div>
<section id="search-panel" aria-label="查找与替换" hidden>
<div class="search-row"><label for="search-query">查找</label><input id="search-query" type="text" maxlength="500" placeholder="查找正文和表格文字"><button id="search-previous" aria-label="上一处">↑</button><button id="search-next" aria-label="下一处">↓</button><label class="search-case"><input id="search-case" type="checkbox">区分大小写</label><button id="search-close" aria-label="关闭查找">×</button></div>
<div class="search-row"><label for="search-replacement">替换</label><input id="search-replacement" type="text" maxlength="10000" placeholder="留空可删除匹配文字"><button id="search-replace">替换</button><button id="search-replace-all">全部替换</button><span id="search-count" role="status"></span></div>
</section>
<section id="paragraph-panel" class="layout-panel" role="dialog" aria-label="段落设置" hidden></section>
<section id="table-panel" class="layout-panel" role="dialog" aria-label="表格操作" hidden></section>
<div id="word-context-menu" role="menu" aria-label="文档编辑菜单" hidden>
<button role="menuitem" data-context-action="cut">剪切</button><button role="menuitem" data-context-action="copy">复制</button><button role="menuitem" data-context-action="paste">粘贴</button><hr>
<button role="menuitem" data-context-action="font">字体与字号…</button><button role="menuitem" data-context-action="paragraph">段落…</button><button role="menuitem" data-context-action="bullet">项目符号</button><button role="menuitem" data-context-action="decimal">编号</button><hr>
<button role="menuitem" data-context-action="comment">新建批注</button><button role="menuitem" data-context-action="table">表格操作…</button>
</div>
<p id="status" role="status">正在打开 Word 文档…</p>
<div id="workarea"><div id="review-surface"><main id="paper" aria-label="可编辑合同正文"></main>
<aside id="review-pane" aria-label="Word 修订与批注" hidden>
<header class="review-pane-heading"><strong>修订与批注</strong><span id="review-count"></span><button id="close-review" type="button" aria-label="收起修订与批注" title="收起修订与批注">×</button></header>
<div id="comment-form" role="group" aria-label="新建批注" hidden><label for="comment-text">批注内容</label><textarea id="comment-text" maxlength="4000" rows="4"></textarea><button type="button" id="save-comment">保存批注</button><button type="button" id="cancel-comment">取消</button></div>
<div id="review-scroll"><div id="review-list"></div></div></aside><svg id="review-connectors" aria-hidden="true"></svg></div></div>
<footer id="view-tools" aria-label="文档显示">
<details id="keyboard-guide"><summary>键盘操作</summary><div><p>Enter 换段；Shift+Enter 段内换行；Tab 制表或进入下一单元格；Shift+Tab 返回上一单元格。按住 Shift 配合方向键选择文字。</p><p id="keyboard-help"></p></div></details><button id="show-formatting-marks" aria-pressed="true" title="显示或隐藏空格、制表符和换行标记">编辑标记</button><span class="view-label">页面缩放</span>
<button id="zoom-out" aria-label="缩小文档" title="缩小文档" disabled>−</button>
<select id="zoom-level" aria-label="文档缩放比例" disabled><option id="zoom-current" value="current" hidden></option><option value="50">50%</option><option value="75">75%</option><option value="100" selected>100%</option><option value="125">125%</option><option value="150">150%</option><option value="175">175%</option><option value="200">200%</option></select>
<button id="zoom-in" aria-label="放大文档" title="放大文档" disabled>+</button>
<span class="divider"></span><button id="zoom-width" aria-pressed="true" disabled>适合宽度</button><button id="zoom-page" aria-pressed="false" disabled>整页</button>
</footer>
</body></html>
