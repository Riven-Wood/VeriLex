[package]
name = "verilex-desktop"
version = "1.1.1"
description = "VeriLex local-first legal agent desktop shell"
edition = "2021"
rust-version = "1.88"

[lib]
name = "verilex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sha2 = "0.10"
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
notify-rust = "=4.11.7"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json"] }
rustls = { version = "=0.23.43", default-features = false, features = ["std", "ring"] }
