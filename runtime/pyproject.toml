[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verilex-runtime"
version = "1.1.0"
description = "Local-only agent runtime for the VeriLex desktop application"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "html5lib==1.1",
  "httpx>=0.27,<1",
  "jsonschema>=4.26,<5",
  "lxml==6.1.2",
  "markdown-it-py==4.2.0",
  "mcp>=1.1,<2",
  "openai>=1,<3",
  "openpyxl==3.1.5",
  "pypdf>=5,<7",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "python-pptx==1.0.2",
  "reportlab==4.4.4",
  "spacy>=3.8,<3.9",
  "tzdata==2026.5",
  "uvicorn[standard]>=0.27,<1",
  "zh-core-web-sm",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.10,<7",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.3,<2",
]
document-rasterizer = [
    "pillow==11.3.0",
    "pypdfium2==5.11.0",
]

[project.scripts]
verilex-runtime = "verilex_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["verilex_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]
pythonpath = ["tests/agent", "tests/providers"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.uv.sources]
zh-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.setuptools.package-data]
"verilex_runtime.litigation.visual_vendor" = ["assets/*.json", "LICENSE", "provenance.json"]
"verilex_runtime.litigation" = ["templates/*.json", "templates/*.xml", "fonts/*.ttf", "fonts/*.txt", "fonts/*.json"]

"verilex_runtime.knowledge" = ["ima_mcp/*.md", "ima_mcp/*.mjs", "ima_mcp/LICENSE"]

"verilex_runtime.excel_plugin.vendor" = ["LICENSE", "provenance.json"]

"verilex_runtime.ppt_plugin.vendor" = ["LICENSE*", "provenance.json"]
