name: Release macOS arm64 updater

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned updater archive
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate annotated tag and release notes
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "release ref must be an annotated tag" >&2
            exit 1
          fi
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > release-notes.md
          awk 'NF { found = 1 } END { exit(found ? 0 : 1) }' release-notes.md

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.14

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.1
          enable-cache: true
          cache-dependency-glob: runtime/uv.lock

      - name: Setup Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target aarch64-apple-darwin
          rustup default 1.88.0
          rustup component add rustfmt --toolchain 1.88.0
          rustc --version

      - name: Install dependencies
        run: |
          npm ci
          uv sync --project runtime --locked --extra dev --python 3.13.14

      - name: Validate release version
        run: npm run --silent check:release-version -- "$GITHUB_REF_NAME"

      - name: Test runtime
        run: runtime/.venv/bin/python -m pytest runtime/tests -q

      - name: Test desktop
        run: npm --workspace desktop test

      - name: Build desktop
        run: npm --workspace desktop run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Test Rust
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Check Rust
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --target aarch64-apple-darwin

      - name: Build updater archive
        run: |
          EPHEMERAL_KEY="$RUNNER_TEMP/verilex-ephemeral.key"
          EPHEMERAL_PASSWORD="verilex-ci-ephemeral-key"
          CI=true node_modules/.bin/tauri signer generate \
            --password "$EPHEMERAL_PASSWORD" \
            --write-keys "$EPHEMERAL_KEY" \
            --force >/dev/null
          TAURI_SIGNING_PRIVATE_KEY="$(<"$EPHEMERAL_KEY")" \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$EPHEMERAL_PASSWORD" \
            /bin/bash -c '(cd desktop && ../node_modules/.bin/tauri build --target aarch64-apple-darwin --bundles app)'
          ARTIFACT_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          rm "$ARTIFACT_DIR/VeriLex.app.tar.gz.sig"
          rm "$EPHEMERAL_KEY" "$EPHEMERAL_KEY.pub"

      - name: Stage unsigned archive
        run: |
          SOURCE="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/VeriLex.app.tar.gz"
          UNSIGNED_DIR="$RUNNER_TEMP/unsigned-updater"
          test -s "$SOURCE"
          mkdir "$UNSIGNED_DIR"
          cp "$SOURCE" "$UNSIGNED_DIR/VeriLex.app.tar.gz"
          test "$(find "$UNSIGNED_DIR" -type f | wc -l | tr -d ' ')" = "1"

      - name: Upload unsigned archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verilex-macos-arm64-unsigned
          path: ${{ runner.temp }}/unsigned-updater/VeriLex.app.tar.gz
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign updater archive
    needs: build
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked signer CLI
        run: npm ci --ignore-scripts

      - name: Download unsigned archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verilex-macos-arm64-unsigned
          path: ${{ runner.temp }}/unsigned-updater

      - name: Verify unsigned archive
        run: |
          UNSIGNED_DIR="$RUNNER_TEMP/unsigned-updater"
          test -s "$UNSIGNED_DIR/VeriLex.app.tar.gz"
          test "$(find "$UNSIGNED_DIR" -type f | wc -l | tr -d ' ')" = "1"

      - name: Sign updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ARTIFACT="$RUNNER_TEMP/unsigned-updater/VeriLex.app.tar.gz"
          node_modules/.bin/tauri signer sign "$ARTIFACT" >/dev/null

      - name: Verify signed updater files
        run: |
          SIGNED_DIR="$RUNNER_TEMP/unsigned-updater"
          test -s "$SIGNED_DIR/VeriLex.app.tar.gz"
          test -s "$SIGNED_DIR/VeriLex.app.tar.gz.sig"
          test "$(find "$SIGNED_DIR" -type f | wc -l | tr -d ' ')" = "2"

      - name: Upload signed updater files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verilex-macos-arm64-signed
          path: |
            ${{ runner.temp }}/unsigned-updater/VeriLex.app.tar.gz
            ${{ runner.temp }}/unsigned-updater/VeriLex.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Validate and publish release
    needs: sign
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Download signed updater files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verilex-macos-arm64-signed
          path: ${{ runner.temp }}/signed-updater

      - name: Verify signed updater files
        run: |
          SIGNED_DIR="$RUNNER_TEMP/signed-updater"
          test -s "$SIGNED_DIR/VeriLex.app.tar.gz"
          test -s "$SIGNED_DIR/VeriLex.app.tar.gz.sig"
          test "$(find "$SIGNED_DIR" -type f | wc -l | tr -d ' ')" = "2"

      - name: Read release metadata
        run: |
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "release ref must be an annotated tag" >&2
            exit 1
          fi
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > release-notes.md
          awk 'NF { found = 1 } END { exit(found ? 0 : 1) }' release-notes.md

      - name: Create updater manifest
        run: |
          SIGNED_DIR="$RUNNER_TEMP/signed-updater"
          VERSION="$(npm run --silent check:release-version -- "$GITHUB_REF_NAME")"
          PUB_DATE="$(git for-each-ref --format='%(taggerdate:iso-strict)' "refs/tags/$GITHUB_REF_NAME")"
          node scripts/create-updater-manifest.mjs \
            --version "$VERSION" \
            --notes-file release-notes.md \
            --pub-date "$PUB_DATE" \
            --signature-file "$SIGNED_DIR/VeriLex.app.tar.gz.sig" \
            --output latest.json

      - name: Verify updater signature against app public key
        run: |
          SIGNED_DIR="$RUNNER_TEMP/signed-updater"
          node scripts/verify-updater-signature.mjs \
            "$SIGNED_DIR/VeriLex.app.tar.gz" \
            "$SIGNED_DIR/VeriLex.app.tar.gz.sig" \
            desktop/src-tauri/tauri.conf.json

      - name: Stage draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIGNED_DIR="$RUNNER_TEMP/signed-updater"
          VERSION="${GITHUB_REF_NAME#v}"
          assert_draft() {
            RELEASE_STATE="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
            if [ "$RELEASE_STATE" != "true" ]; then
              echo "refusing to replace an already published release" >&2
              exit 1
            fi
          }
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft >/dev/null 2>&1; then
            :
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --draft \
              --title "VeriLex $VERSION" \
              --notes-file release-notes.md
          fi
          assert_draft
          gh release edit "$GITHUB_REF_NAME" \
            --title "VeriLex $VERSION" \
            --notes-file release-notes.md
          assert_draft
          gh release upload "$GITHUB_REF_NAME" \
            "$SIGNED_DIR/VeriLex.app.tar.gz#VeriLex.app.tar.gz" \
            "$SIGNED_DIR/VeriLex.app.tar.gz.sig#VeriLex.app.tar.gz.sig" \
            "latest.json#latest.json" \
            --clobber

      - name: Validate release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --json assets | node scripts/validate-release-assets.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATE="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)"
          if [ "$RELEASE_STATE" != "true" ]; then
            echo "refusing to mutate an already published release" >&2
            exit 1
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
